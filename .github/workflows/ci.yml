name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    services:
      # For integration tests and --dry-run once implemented.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbiq
          POSTGRES_PASSWORD: dbiq
          POSTGRES_DB: dbiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBIQ_DATABASE_URL: postgresql://dbiq:dbiq@localhost:5432/dbiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Dogfood: the built CLI must flag the example migration (exit code 1).
      - name: Smoke test CLI
        run: |
          set +e
          node dist/cli.js check examples/risky-migration.sql
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi
